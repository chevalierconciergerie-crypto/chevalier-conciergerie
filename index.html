    <!--
      Fiche d'établissement servie sur toutes les pages. Le `@id` est identique à celui
      déclaré dans src/pages/Index.tsx : Google fusionne alors les deux déclarations au
      lieu de les traiter comme deux entreprises concurrentes. Toute modification ici
      doit être répercutée là-bas, et inversement.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://chevalier-conciergerie.com",
      "name": "Chevalier Conciergerie",
      "image": "https://chevalier-conciergerie.com/og-image.png",
      "logo": "https://chevalier-conciergerie.com/favicon.png",
      "url": "https://chevalier-conciergerie.com",
      "telephone": "+33783198341",
      "email": "contact@chevalier-conciergerie.com",
      "description": "Conciergerie Airbnb et gestion locative saisonnière haut de gamme à Avignon. Sous-location professionnelle avec loyer garanti.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "5 Lotissement Les Cades",
        "addressLocality": "Villeneuve-lès-Avignon",
        "postalCode": "30400",
        "addressRegion": "Provence-Alpes-Côte d'Azur",
        "addressCountry": "FR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 43.9657,
        "longitude": 4.7956
      },
      "areaServed": [
        { "@type": "City", "name": "Avignon" },
        { "@type": "City", "name": "Villeneuve-lès-Avignon" },
        { "@type": "City", "name": "Les Angles" }
      ],
      "serviceType": ["Conciergerie Airbnb", "Gestion locative saisonnière", "Sous-location professionnelle"],
      "priceRange": "€€",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "sameAs": [
        "https://www.google.com/maps/place/CHEVALIER+CONCIERGERIE/@43.8680214,4.8327906,17z"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!--
      Préchargement retiré. Il pointait vers /src/assets/hero-video-luxury.mp4, un chemin
      qui n'existe qu'en développement : au build, Vite renomme le fichier avec un hash.
      En production cette ligne déclenchait donc un 404 sur chaque page, et `as="fetch"`
      n'aurait de toute façon pas alimenté l'élément <video>. Le poster du hero couvre
      désormais l'affichage initial.
    -->

    <!--
      Google Analytics 4 : le script chargeait l'ID d'exemple G-XXXXXXXXXX. Résultat,
      une requête externe bloquante à chaque visite et zéro donnée collectée. Retiré.

      Pour l'activer, crée une propriété sur https://analytics.google.com, récupère ton
      ID de mesure (format G-XXXXXXXXXX) et remets ce bloc en remplaçant les deux
      occurrences :
      <script async src="https://www.googletagmanager.com/gtag/js?id=TON_ID"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'TON_ID');
      </script>
    -->
  </head>
